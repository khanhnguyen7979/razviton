<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024">

<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#123b78"/>
    <stop offset="55%" stop-color="#07162f"/>
    <stop offset="100%" stop-color="#020611"/>
  </radialGradient>

  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fff1a0"/>
    <stop offset="35%" stop-color="#f5c64f"/>
    <stop offset="70%" stop-color="#b87914"/>
    <stop offset="100%" stop-color="#ffe58a"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1024" height="1024" fill="#020611"/>

<circle cx="512" cy="512" r="440"
        fill="url(#bg)"
        stroke="url(#gold)"
        stroke-width="30"/>

<circle cx="512" cy="512" r="390"
        fill="none"
        stroke="#248bff"
        stroke-width="8"
        opacity="0.8"/>

<circle cx="512" cy="512" r="355"
        fill="none"
        stroke="#dcae3c"
        stroke-width="4"
        opacity="0.6"/>

<text x="512" y="205"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-weight="700"
      font-size="68"
      letter-spacing="10"
      fill="url(#gold)">RAZVITON</text>

<text x="512" y="650"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-weight="900"
      font-size="470"
      fill="url(#gold)"
      filter="url(#glow)">R</text>

<ellipse cx="512" cy="520"
         rx="300" ry="115"
         fill="none"
         stroke="#3aa0ff"
         stroke-width="14"
         transform="rotate(-18 512 520)"
         filter="url(#glow)"/>

<circle cx="760" cy="430" r="18"
        fill="#fff4b0"
        filter="url(#glow)"/>

<text x="512" y="870"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-weight="700"
      font-size="72"
      letter-spacing="12"
      fill="url(#gold)">RAZV</text>

<text x="512" y="930"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="28"
      letter-spacing="5"
      fill="#d8e8ff">FROM INTELLIGENCE TO REAL VALUE</text>

</svg>